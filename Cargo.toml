[workspace]
resolver = "2"
members = [
    "src-tauri",
]

[workspace.package]
edition = "2021"

# Release 构建: 性能优先 (opt-level=3) + LTO + strip 收缩体积
# 注: panic="abort" 会让 panic 直接终止进程且不产生回溯，
#     已在 lib.rs 装 panic hook 将其写入 .teas/launcher.log 兜底。
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
