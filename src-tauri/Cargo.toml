[package]
name = "teas-launcher"
version = "0.1.1"
edition.workspace = true

[lib]
name = "teas_launcher_lib"
crate-type = ["lib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
reqwest = { version = "0.12", features = ["rustls-tls", "brotli", "gzip", "stream", "socks", "json"], default-features = false }
winreg = "0.52"
tokio = { version = "1", features = ["time"] }
dirs = "5"
log = "0.4"
md5 = "0.7"
sha1 = "0.10"
once_cell = "1"
zip = "2"
urlencoding = "2"
futures-util = "0.3"
